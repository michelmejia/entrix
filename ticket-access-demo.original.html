<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso — Demo de entradas digitales</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --void:#0B0E14;
    --panel:#131822;
    --panel-raised:#1B2130;
    --border:#262D3D;
    --border-soft:#1E2434;
    --text:#E8ECF4;
    --text-muted:#8B93A7;
    --text-faint:#5B637A;
    --accent:#7C6FF0;
    --accent-dim:#352C6E;
    --accent-soft:rgba(124,111,240,0.14);
    --green:#22C55E;
    --green-soft:rgba(34,197,94,0.14);
    --amber:#F5A524;
    --amber-soft:rgba(245,165,36,0.14);
    --red:#EF4444;
    --red-soft:rgba(239,68,68,0.14);
    --radius:8px;
    --font-ui:'Space Grotesk', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', 'Courier New', monospace;
  }
  @font-face{font-family:'Space Grotesk';src:local('Space Grotesk');}
  * { box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--void);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  ::selection{ background:var(--accent-dim); }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input,select{ font-family:inherit; }

  /* ---------- Login ---------- */
  .login-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(124,111,240,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(34,197,94,0.06), transparent 40%),
      var(--void);
    padding:24px;
  }
  .login-card{ width:100%; max-width:400px; }
  .brand-mark{
    display:flex; align-items:center; gap:10px; margin-bottom:36px;
  }
  .brand-mark .dot{
    width:10px;height:10px;border-radius:2px;background:var(--accent);
    box-shadow:0 0 14px rgba(124,111,240,0.7);
  }
  .brand-mark span{ font-weight:600; font-size:15px; letter-spacing:0.02em; color:var(--text-muted); }
  .login-card h1{
    font-size:30px; font-weight:600; letter-spacing:-0.01em; margin:0 0 8px;
    line-height:1.2;
  }
  .login-card p.sub{ color:var(--text-muted); font-size:14px; margin:0 0 32px; line-height:1.5; }
  .role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  .role-btn{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 14px; text-align:left; color:var(--text); transition:border-color .15s, background .15s;
  }
  .role-btn:hover{ border-color:var(--accent); background:var(--panel-raised); }
  .role-btn.active{ border-color:var(--accent); background:var(--accent-soft); }
  .role-btn .role-title{ font-weight:600; font-size:14px; margin-bottom:4px; }
  .role-btn .role-desc{ font-size:12px; color:var(--text-muted); line-height:1.4; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .field input, .field select{
    width:100%; background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:11px 12px; border-radius:6px; font-size:14px; outline:none;
  }
  .field input:focus, .field select:focus{ border-color:var(--accent); }
  .btn-primary{
    width:100%; background:var(--accent); color:#fff; border:none; padding:12px 16px;
    border-radius:6px; font-size:14px; font-weight:600; margin-top:6px;
  }
  .btn-primary:hover{ background:#8f83f5; }
  .btn-primary:disabled{ background:var(--panel-raised); color:var(--text-faint); cursor:not-allowed; }
  .login-hint{ margin-top:22px; font-size:12px; color:var(--text-faint); line-height:1.6; }

  /* ---------- Shell ---------- */
  .shell{ display:flex; flex:1; min-height:100vh; }
  .rail{
    width:208px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:18px 12px;
  }
  .rail-brand{ display:flex; align-items:center; gap:9px; padding:6px 8px 22px; }
  .rail-brand .dot{ width:9px;height:9px;border-radius:2px;background:var(--accent); box-shadow:0 0 12px rgba(124,111,240,0.7); }
  .rail-brand span{ font-weight:600; font-size:14px; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px;
    color:var(--text-muted); font-size:13.5px; font-weight:500; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
  }
  .nav-item:hover{ background:var(--panel-raised); color:var(--text); }
  .nav-item.active{ background:var(--accent-soft); color:var(--text); }
  .nav-item .ic{ width:15px; text-align:center; opacity:0.85; }
  .rail-footer{ margin-top:auto; padding:12px 10px 4px; border-top:1px solid var(--border-soft); }
  .rail-user{ font-size:12.5px; color:var(--text-muted); margin-bottom:8px; }
  .rail-user b{ color:var(--text); display:block; font-size:13px; }
  .logout-btn{ background:none; border:1px solid var(--border); color:var(--text-muted); font-size:12px; padding:6px 10px; border-radius:6px; width:100%; }
  .logout-btn:hover{ border-color:var(--red); color:var(--red); }

  .main{ flex:1; padding:28px 34px; overflow-y:auto; max-height:100vh; }
  .main-header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .main-header h2{ font-size:20px; font-weight:600; margin:0 0 4px; letter-spacing:-0.01em; }
  .main-header p{ margin:0; font-size:13px; color:var(--text-muted); }

  /* ---------- Stat cards ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
  .stat-card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
  .stat-card .label{ font-size:11.5px; color:var(--text-muted); margin-bottom:8px; }
  .stat-card .value{ font-size:26px; font-weight:600; font-family:var(--font-mono); letter-spacing:-0.02em; }
  .stat-card .value.green{ color:var(--green); }
  .stat-card .value.amber{ color:var(--amber); }
  .bar-track{ height:5px; background:var(--panel-raised); border-radius:3px; margin-top:10px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:3px; transition:width .4s; }

  /* ---------- Panels / tables ---------- */
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:20px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border-soft); }
  .panel-head h3{ margin:0; font-size:14px; font-weight:600; }
  .panel-body{ padding:16px 18px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--text-muted); font-weight:500; font-size:11.5px; padding:0 14px 10px; border-bottom:1px solid var(--border-soft); }
  td{ padding:11px 14px; border-bottom:1px solid var(--border-soft); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .mono{ font-family:var(--font-mono); font-size:12px; color:var(--text-muted); }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.disponible{ background:var(--accent-soft); color:var(--accent); }
  .badge.usada{ background:var(--amber-soft); color:var(--amber); }
  .badge.activo{ background:var(--green-soft); color:var(--green); }
  .badge.inactivo{ background:rgba(139,147,167,0.14); color:var(--text-muted); }
  .badge.valid{ background:var(--green-soft); color:var(--green); }
  .badge.used{ background:var(--amber-soft); color:var(--amber); }
  .badge.invalid{ background:var(--red-soft); color:var(--red); }
  .link-btn{ background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:600; padding:0; }
  .link-btn:hover{ text-decoration:underline; }
  .btn{ background:var(--panel-raised); border:1px solid var(--border); color:var(--text); padding:8px 14px; border-radius:6px; font-size:13px; font-weight:500; }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ background:#8f83f5; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .empty{ text-align:center; padding:40px 20px; color:var(--text-faint); font-size:13px; }

  .grid-2{ display:grid; grid-template-columns:1.1fr 1.4fr; gap:20px; align-items:start; }
  @media (max-width:1000px){ .grid-2{ grid-template-columns:1fr; } .stat-row{ grid-template-columns:1fr 1fr; } }

  /* form */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .form-grid .full{ grid-column:1/-1; }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,8,12,0.72); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .ticket-card{
    background:#fff; color:#0B0E14; border-radius:14px; width:320px; overflow:hidden;
    font-family:var(--font-ui);
  }
  .ticket-card .tc-head{ background:var(--accent); color:#fff; padding:16px 18px; }
  .ticket-card .tc-head .ev{ font-weight:700; font-size:15px; }
  .ticket-card .tc-head .meta{ font-size:12px; opacity:0.9; margin-top:2px; }
  .ticket-card .tc-body{ padding:20px; display:flex; flex-direction:column; align-items:center; }
  .qr-box{ background:#fff; padding:8px; border:1px solid #eee; border-radius:8px; }
  .ticket-card .tc-token{ font-family:var(--font-mono); font-size:10.5px; color:#666; margin-top:14px; word-break:break-all; text-align:center; }
  .ticket-card .tc-status{ margin-top:10px; }
  .ticket-card .tc-close{ display:block; width:100%; text-align:center; padding:12px; border-top:1px solid #eee; background:#fafafa; color:#555; font-size:13px; font-weight:600; border:none; }

  /* ---------- Scanner ---------- */
  .scanner-wrap{ display:grid; grid-template-columns:340px 1fr; gap:20px; align-items:start; }
  @media (max-width:900px){ .scanner-wrap{ grid-template-columns:1fr; } }
  .scan-stage{
    position:relative; min-height:420px; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .scan-idle{ text-align:center; color:var(--text-faint); padding:30px; }
  .scan-target{
    width:150px; height:150px; border:2px dashed var(--border); border-radius:14px; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--text-faint);
  }
  .result-overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; animation:pop .18s ease-out;
  }
  @keyframes pop{ from{ opacity:0; transform:scale(0.97);} to{opacity:1; transform:scale(1);} }
  .result-overlay.ok{ background:linear-gradient(180deg, rgba(34,197,94,0.22), rgba(34,197,94,0.08)); }
  .result-overlay.used{ background:linear-gradient(180deg, rgba(245,165,36,0.22), rgba(245,165,36,0.08)); }
  .result-overlay.bad{ background:linear-gradient(180deg, rgba(239,68,68,0.22), rgba(239,68,68,0.08)); }
  .result-icon{ font-size:56px; margin-bottom:14px; }
  .result-title{ font-size:24px; font-weight:700; letter-spacing:-0.01em; margin-bottom:6px; }
  .result-title.ok{ color:var(--green); }
  .result-title.used{ color:var(--amber); }
  .result-title.bad{ color:var(--red); }
  .result-sub{ font-size:13px; color:var(--text-muted); line-height:1.6; }
  .result-sub .mono{ color:var(--text); }
  .scan-panel{ padding:18px; }
  .scan-panel .field{ margin-bottom:12px; }

  .notice{
    display:flex; gap:10px; padding:11px 14px; border-radius:6px; font-size:12.5px; line-height:1.5;
    background:var(--accent-soft); color:var(--text); border:1px solid var(--accent-dim); margin-bottom:16px;
  }
  .notice.warn{ background:var(--red-soft); border-color:rgba(239,68,68,0.35); }

  /* concurrency demo */
  .duel{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
  .duel-card{ background:var(--panel-raised); border:1px solid var(--border); border-radius:8px; padding:14px; }
  .duel-card .duel-label{ font-size:11.5px; color:var(--text-muted); margin-bottom:8px; }
  .duel-card .duel-result{ font-size:16px; font-weight:700; }
  .duel-card .duel-result.ok{ color:var(--green); }
  .duel-card .duel-result.used{ color:var(--amber); }
  .duel-card .duel-time{ font-size:11px; color:var(--text-faint); margin-top:6px; font-family:var(--font-mono); }
  .verdict{ margin-top:14px; padding:12px 14px; border-radius:8px; font-size:13px; font-weight:600; }
  .verdict.pass{ background:var(--green-soft); color:var(--green); }
  .verdict.fail{ background:var(--red-soft); color:var(--red); }
  .toggle-row{ display:flex; align-items:center; gap:10px; margin:14px 0; }
  .switch{ position:relative; width:40px; height:22px; background:var(--panel-raised); border:1px solid var(--border); border-radius:20px; }
  .switch.on{ background:var(--accent-dim); border-color:var(--accent); }
  .switch .knob{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--text-muted); transition:left .15s; }
  .switch.on .knob{ left:20px; background:var(--accent); }

  .code-note{ background:var(--panel-raised); border:1px solid var(--border-soft); border-radius:6px; padding:12px 14px; font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted); line-height:1.7; white-space:pre-wrap; }

  .sec-block{ margin-bottom:18px; }
  .sec-block h4{ font-size:13.5px; margin:0 0 6px; color:var(--text); }
  .sec-block p{ font-size:13px; color:var(--text-muted); line-height:1.65; margin:0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   ESTADO EN MEMORIA (demo — sin persistencia ni backend real)
   ========================================================= */
const state = {
  view: 'login',          // login | admin | validador
  adminTab: 'eventos',    // eventos | entradas | escaner | concurrencia | auditoria | seguridad
  currentUser: null,      // {role, name}
  events: [],
  tickets: [],
  validations: [],
  selectedEventId: null,     // admin: evento gestionado en "Entradas"
  validatorEventId: null,    // validador: evento seleccionado para escanear
  scanResult: null,          // resultado mostrado en el escáner principal
  concTicketId: null,
  concProtected: true,
  concResults: null,
  modalTicketId: null,
  _idSeq: 1,
};

function uid(prefix){ return prefix + '_' + (state._idSeq++); }

function generateToken(){
  const arr = new Uint8Array(24); // 192 bits de entropía
  crypto.getRandomValues(arr);
  return Array.from(arr, b => b.toString(16).padStart(2,'0')).join('');
}

function fmtDateTime(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit'}) + ' ' + dt.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ---------- Bloqueo por-entrada (simula transacción atómica) ---------- */
const locks = new Map();
function withLock(key, fn){
  const prev = locks.get(key) || Promise.resolve();
  const run = prev.then(fn, fn);
  locks.set(key, run.catch(()=>{}));
  return run;
}

/* =========================================================
   LÓGICA DE NEGOCIO
   ========================================================= */
function createEvent({name,date,time,location,capacity}){
  const ev = { id: uid('ev'), name, date, time, location, capacity: Number(capacity), status:'activo', createdAt:new Date() };
  state.events.push(ev);
  state.selectedEventId = ev.id;
  return ev;
}

function toggleEventStatus(id){
  const ev = state.events.find(e=>e.id===id);
  ev.status = ev.status === 'activo' ? 'inactivo' : 'activo';
}

function generateTickets(eventId, qty){
  const created = [];
  for(let i=0;i<qty;i++){
    const t = { id: uid('tk'), eventId, token: generateToken(), status:'DISPONIBLE', createdAt:new Date(), usedAt:null, usedBy:null };
    state.tickets.push(t);
    created.push(t);
  }
  return created;
}

function logValidation(ticket, eventId, userName, result){
  state.validations.unshift({
    id: uid('val'), ticketId: ticket ? ticket.id : null, eventId,
    userName, result, date: new Date()
  });
}

// Validación "segura": todo el ciclo lectura-decisión-escritura ocurre dentro del lock.
async function validateSafe(token, eventId, userName){
  const ticket = state.tickets.find(t=>t.token===token);
  if(!ticket){ logValidation(null, eventId, userName, 'INVALID'); return {result:'INVALID'}; }
  if(ticket.eventId !== eventId){ logValidation(ticket, eventId, userName, 'INVALID'); return {result:'INVALID', reason:'otro evento'}; }

  return withLock(ticket.id, async () => {
    if(ticket.status === 'USADA'){
      logValidation(ticket, eventId, userName, 'USED');
      return {result:'USED', usedAt:ticket.usedAt, usedBy:ticket.usedBy};
    }
    await sleep(150); // trabajo simulado (equivalente a una escritura en BD)
    ticket.status = 'USADA';
    ticket.usedAt = new Date();
    ticket.usedBy = userName;
    logValidation(ticket, eventId, userName, 'VALID');
    return {result:'VALID'};
  });
}

// Validación "insegura": lee el estado, espera, y luego decide — sin bloqueo.
// Reproduce a propósito la condición de carrera (TOCTOU) para fines didácticos.
async function validateUnsafe(ticket, userName){
  const wasUsed = ticket.status === 'USADA';
  await sleep(150);
  if(wasUsed){
    return {result:'USED', usedAt:ticket.usedAt, usedBy:ticket.usedBy};
  }
  ticket.status = 'USADA';
  ticket.usedAt = new Date();
  ticket.usedBy = userName;
  return {result:'VALID'};
}

/* =========================================================
   RENDER
   ========================================================= */
const app = document.getElementById('app');
function render(){
  if(state.view === 'login') return renderLogin();
  if(state.view === 'admin') return renderAdmin();
  if(state.view === 'validador') return renderValidador();
}

/* ---------- LOGIN ---------- */
let pendingRole = 'admin';
function renderLogin(){
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark"><div class="dot"></div><span>ACCESO — demo</span></div>
      <h1>Entrar al sistema</h1>
      <p class="sub">Elige un rol para simular la sesión. No requiere contraseña real: es una demostración funcional en el navegador.</p>
      <div class="role-grid">
        <button class="role-btn ${pendingRole==='admin'?'active':''}" data-role="admin">
          <div class="role-title">Administrador</div>
          <div class="role-desc">Crea eventos, genera entradas, ve estadísticas.</div>
        </button>
        <button class="role-btn ${pendingRole==='validador'?'active':''}" data-role="validador">
          <div class="role-title">Validador</div>
          <div class="role-desc">Escanea entradas en el punto de acceso.</div>
        </button>
      </div>
      <div class="field">
        <label>Nombre</label>
        <input id="loginName" type="text" placeholder="${pendingRole==='admin'?'ej. Marta Ríos':'ej. Puerta 2 — Diego'}" />
      </div>
      <button class="btn-primary" id="loginBtn">Continuar</button>
      <div class="login-hint">Los tokens de entrada se generan con <span class="mono">crypto.getRandomValues</span> (192 bits) — no son incrementales ni predecibles.</div>
    </div>
  </div>`;

  app.querySelectorAll('.role-btn').forEach(b=>b.onclick = ()=>{ pendingRole = b.dataset.role; renderLogin(); });
  app.querySelector('#loginBtn').onclick = ()=>{
    const name = app.querySelector('#loginName').value.trim() || (pendingRole==='admin' ? 'Administrador' : 'Validador');
    state.currentUser = { role: pendingRole, name };
    if(pendingRole==='admin'){
      state.view='admin'; state.adminTab='eventos';
    } else {
      state.view='validador';
      if(!state.validatorEventId){
        const firstActive = state.events.find(e=>e.status==='activo');
        state.validatorEventId = firstActive ? firstActive.id : null;
      }
    }
    render();
  };
}

function logout(){
  state.currentUser = null; state.view='login'; state.scanResult=null; render();
}

/* ---------- ADMIN SHELL ---------- */
function renderAdmin(){
  const navItems = [
    ['eventos','Eventos','◧'],
    ['entradas','Entradas','▤'],
    ['auditoria','Auditoría','≡'],
    ['concurrencia','Concurrencia','⇄'],
    ['seguridad','Seguridad','⛨'],
  ];
  app.innerHTML = `
  <div class="shell">
    <div class="rail">
      <div class="rail-brand"><div class="dot"></div><span>ACCESO</span></div>
      ${navItems.map(([key,label,ic])=>`
        <button class="nav-item ${state.adminTab===key?'active':''}" data-tab="${key}">
          <span class="ic">${ic}</span>${label}
        </button>`).join('')}
      <div class="rail-footer">
        <div class="rail-user"><b>${escapeHtml(state.currentUser.name)}</b>Administrador</div>
        <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
      </div>
    </div>
    <div class="main" id="mainArea"></div>
  </div>`;
  app.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{ state.adminTab=b.dataset.tab; render(); });
  app.querySelector('#logoutBtn').onclick = logout;

  const main = app.querySelector('#mainArea');

/* ---------- TAB: CONCURRENCIA (demo del doble escaneo) ---------- */
function renderTabConcurrencia(main){
  const available = state.tickets.filter(t=>t.status==='DISPONIBLE');
  if(!state.concTicketId && available.length) state.concTicketId = available[0].id;

  main.innerHTML = `

    <div class="notice">Elige una entrada disponible y dispara dos validaciones concurrentes. Con la protección activada, solo una puede marcar la entrada como usada — la operación es atómica por entrada (equivalente a una transacción con bloqueo en la base de datos real).</div>
    <div class="panel">
      <div class="panel-body">
        <div class="form-grid">
          <div class="field full">
            <label>Entrada a probar</label>
            <select id="concPicker">
              ${available.length===0 ? `<option>No hay entradas disponibles — genera alguna primero</option>` :
                available.map(t=>`<option value="${t.id}" ${t.id===state.concTicketId?'selected':''}>${t.token.slice(0,18)}… — ${state.events.find(e=>e.id===t.eventId)?.name||''}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="toggle-row">
          <button id="concToggle" class="switch ${state.concProtected?'on':''}"><div class="knob"></div></button>
          <div>
            <div style="font-size:13px;font-weight:600">${state.concProtected ? 'Con protección (bloqueo atómico)' : 'Sin protección (condición de carrera)'}</div>
            <div style="font-size:12px;color:var(--text-muted)">${state.concProtected ? 'validateSafe(): lectura + escritura dentro de un lock por entrada' : 'validateUnsafe(): lee, espera, y recién entonces decide — vulnerable'}</div>
          </div>
        </div>
        <button class="btn primary" id="runDuel" ${available.length===0?'disabled':''}>Simular escaneo doble simultáneo</button>
        <div id="duelArea"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Por qué ocurre el problema</h3></div>
      <div class="panel-body code-note">// Sin protección — dos peticiones concurrentes:
1) Escaneo A lee estado → DISPONIBLE
2) Escaneo B lee estado → DISPONIBLE   (antes de que A escriba)
3) Escaneo A escribe → USADA
4) Escaneo B escribe → USADA           ← BUG: ambas dieron "válida"

// Con protección — bloqueo por entrada (o UPDATE ... WHERE status='DISPONIBLE' en SQL real):
1) Escaneo A adquiere el lock, lee DISPONIBLE, escribe USADA, libera
2) Escaneo B espera el lock, luego lee USADA → responde "ya utilizada"</div>
    </div>
  `;

  const picker = main.querySelector('#concPicker');
  if(picker) picker.onchange = ()=>{ state.concTicketId = picker.value; state.concResults=null; render(); };
  const toggle = main.querySelector('#concToggle');
  toggle.onclick = ()=>{ state.concProtected = !state.concProtected; state.concResults=null; render(); };
  const runBtn = main.querySelector('#runDuel');
  runBtn.onclick = ()=> runConcurrencyDuel(main);

  if(state.concResults) renderDuelResults(main.querySelector('#duelArea'));
}

async function runConcurrencyDuel(main){
  const ticket = state.tickets.find(t=>t.id===state.concTicketId);
  if(!ticket) return;
  const ev = state.events.find(e=>e.id===ticket.eventId);
  main.querySelector('#runDuel').disabled = true;
  main.querySelector('#duelArea').innerHTML = `<div class="empty">Ejecutando dos validaciones en paralelo…</div>`;

  const t0 = performance.now();
  let resA, resB;
  if(state.concProtected){
    [resA, resB] = await Promise.all([
      validateSafe(ticket.token, ev.id, 'Validador — Puerta A'),
      validateSafe(ticket.token, ev.id, 'Validador — Puerta B'),
    ]);
  } else {
    [resA, resB] = await Promise.all([
      validateUnsafe(ticket, 'Validador — Puerta A'),
      validateUnsafe(ticket, 'Validador — Puerta B'),
    ]);
  }
  const dt = Math.round(performance.now()-t0);

  const bothValid = resA.result==='VALID' && resB.result==='VALID';
  state.concResults = { resA, resB, dt, bothValid, protectedMode: state.concProtected };
  render();
}

function renderDuelResults(el){
  if(!el) return;
  const {resA, resB, dt, bothValid, protectedMode} = state.concResults;
  const cardHtml = (label, r) => `
    <div class="duel-card">
      <div class="duel-label">${label}</div>
      <div class="duel-result ${r.result==='VALID'?'ok':'used'}">${r.result==='VALID'?'✓ ENTRADA VÁLIDA':'⚠ YA UTILIZADA'}</div>
      <div class="duel-time">respondió en ~${dt}ms</div>
    </div>`;
  el.innerHTML = `
    <div class="duel">
      ${cardHtml('Escaneo A (Puerta A)', resA)}
      ${cardHtml('Escaneo B (Puerta B)', resB)}
    </div>
    <div class="verdict ${bothValid ? 'fail' : 'pass'}">
      ${bothValid
        ? '✕ Falló: ambas puertas aceptaron la misma entrada como válida. Esto es exactamente lo que el sistema real no debe permitir.'
        : '✓ Correcto: solo una de las dos validaciones marcó la entrada como usada; la otra recibió "ya utilizada".'}
      ${!protectedMode && !bothValid ? ' (con la latencia usada en esta demo, a veces el modo sin protección también acierta por casualidad — vuelve a intentarlo varias veces para ver el bug de forma consistente).' : ''}
    </div>
  `;
}

        </div>
        <div class="field">
          <label>O pegar/escribir un token manualmente</label>
          <input id="manualToken" class="mono" placeholder="token de 48 caracteres…" />
        </div>
        <button class="btn primary" id="scanBtn" style="width:100%">Escanear</button>
        <div class="notice" style="margin-top:16px">${disponibles.length} de ${evTickets.length} entradas siguen disponibles para <b>&nbsp;${escapeHtml(ev.name)}</b>.</div>
      </div>
      <div class="scan-stage">${stageHtml}</div>
    </div>
    ${state.scanResult ? `<div style="margin-top:16px"><button class="btn primary" id="nextScanBtn">Escanear siguiente →</button></div>` : ''}
  `;
}

function wireScannerBody(){
  const quickPick = app.querySelector('#quickPick');
  const manual = app.querySelector('#manualToken');
  if(quickPick) quickPick.onchange = ()=>{ if(quickPick.value) manual.value = quickPick.value; };
  const scanBtn = app.querySelector('#scanBtn');
  if(scanBtn) scanBtn.onclick = async ()=>{
    const token = (manual.value||'').trim();
    if(!token) return;
    const ev = state.events.find(e=>e.id===state.validatorEventId);
    scanBtn.disabled = true;
    const res = await validateSafe(token, ev.id, state.currentUser.name);
    state.scanResult = res;
    render();
  };
  const nextBtn = app.querySelector('#nextScanBtn');
  if(nextBtn) nextBtn.onclick = ()=>{ state.scanResult=null; render(); };
}
